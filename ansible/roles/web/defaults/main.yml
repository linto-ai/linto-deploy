---
# K3S Configuration - default values

# K3S version (empty = use channel)
k3s_version: ""

# K3S channel: stable, latest, testing, or a specific version (v1.33)
k3s_channel: "latest"

# First master address (uses private_ip if defined, otherwise ansible_host)
k3s_master_ip: "{{ hostvars[groups['masters'][0]]['private_ip'] | default(hostvars[groups['masters'][0]]['ansible_host']) }}"

# SAN for API TLS certificate (public for external access)
k3s_api_san: "{{ hostvars[groups['masters'][0]]['ansible_host'] }}"

# Node IP - private IP for inter-node communication
# Each node must define private_ip in the inventory
k3s_node_ip: "{{ private_ip | default(ansible_host) }}"

# Interface pour le VXLAN Flannel. Vide = auto-detection sur la route par defaut.
# ATTENTION : sur un cluster ou l'overlay pod-a-pod transite par un mesh WireGuard,
# l'auto-detection choisit l'iface publique/vRack (ex. ens3, MTU 1500) et fixe flannel.1
# a 1450, alors que les paquets VXLAN partent en realite par wg0 (MTU 1390) -> les gros
# paquets (SRT ~1360) depassent wg0, ICMP frag-needed -> Traefik "read: message too long"
# et flap des flux UDP toutes les ~10 min (TTL du cache PMTU). flannel.1 doit refleter le
# chemin reel : positionner "wg0" pour que flannel derive flannel.1 = MTU(wg0) - 50 et
# publie le bon VTEP. A regler pour tout cluster dont les VTEP flannel sont des IP WireGuard.
# NB : sur le master, flannel-iface reste ens7 (VTEP/FDB) donc flannel derive 1450 ->
# voir flannel_mtu_enforce ci-dessous qui repince flannel.1 a MTU(wg0)-50 la ou l'iface
# ne peut pas etre wg0.
k3s_flannel_iface: ""

# --- Flannel VXLAN MTU enforcement (clusters a overlay WireGuard) -----------
# k3s derive flannel.1 = (MTU flannel-iface) - 50. Correct sur un spoke dont
# l'iface est wg0 (1420 -> 1370), mais PAS sur le master dont l'iface est ens7
# (1500 -> 1450) pour des raisons de VTEP/FDB alors que l'egress VXLAN reel passe
# par wg0. La divergence 1450 vs 1370 drop silencieusement les gros paquets UDP
# inter-noeuds (le flap SRT ~10 min) et est recreee a chaque restart k3s / reboot.
# Active -> un service oneshot + timer systemd repince flannel.1 a (MTU wg0 - 50),
# derive en live depuis wg0, sur chaque noeud. Idempotent (ne touche flannel.1 que
# si la MTU differe). Off par defaut : les clusters mono-noeud / sans overlay n'en
# ont pas besoin (et ne doivent pas voir leur flannel.1 rabaisse a 1370).
flannel_mtu_enforce: false
# Cible de repli si wg0 est absent (les clusters a overlay ont toujours wg0).
flannel_mtu: 1370

# Disable Traefik (we install our own)
k3s_disable_traefik: true

# Helm installation
k3s_install_helm: true
helm_version: ""

# kubeconfig path
k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# K3S server configuration
k3s_server_options:
  - "--cluster-init"
  - "--disable traefik"
  - "--write-kubeconfig-mode 644"

# K3S agent configuration
k3s_agent_options: []

# Labels to apply to GPU nodes
k3s_node_labels: []

# Role to execute (server or agent)
web_role: ""

# Installation timeout
k3s_install_timeout: 300

# K3S configuration directory
k3s_config_dir: /etc/rancher/k3s
