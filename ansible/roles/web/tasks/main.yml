---
# Web role - K3S installation (server or agent)

- name: Check web_role is defined
  ansible.builtin.fail:
    msg: "Variable web_role must be set to 'server' or 'agent'"
  when: web_role not in ['server', 'agent']
  tags:
    - k3s
    - validation

- name: Include server tasks
  ansible.builtin.include_tasks: server.yml
  when: web_role == 'server'
  tags:
    - k3s
    - server

- name: Include agent tasks
  ansible.builtin.include_tasks: agent.yml
  when: web_role == 'agent'
  tags:
    - k3s
    - agent

# Pin flannel.1 MTU to the WireGuard overlay path (wg0 - 50). Applies to both
# server and agent nodes; gated so single-node / non-overlay clusters skip it.
- name: Enforce flannel VXLAN MTU (WireGuard overlay)
  ansible.builtin.include_tasks: flannel-mtu.yml
  when: flannel_mtu_enforce | bool
  tags:
    - k3s
    - flannel
    - mtu
