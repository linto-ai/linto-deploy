---
# Pin flannel.1 MTU to the WireGuard overlay path (wg0 - 50) on every node.
# See defaults/main.yml (flannel_mtu_enforce) for the why: k3s derives flannel.1
# from the flannel-iface, which is correct on wg0 spokes but wrong on the master
# (ens7 -> 1450), and the divergence silently drops large inter-node UDP (SRT).

- name: Install flannel MTU enforcement script
  ansible.builtin.copy:
    src: linto-flannel-mtu.sh
    dest: /usr/local/sbin/linto-flannel-mtu.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - flannel
    - mtu

- name: Install flannel MTU systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - linto-flannel-mtu.service
    - linto-flannel-mtu.timer
  tags:
    - flannel
    - mtu

- name: Enable and start flannel MTU service + timer
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - linto-flannel-mtu.service
    - linto-flannel-mtu.timer
  tags:
    - flannel
    - mtu
