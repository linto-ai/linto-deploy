---
- name: Pull vLLM Docker image
  community.docker.docker_image:
    name: "{{ item.image | default(vllm_docker_image) }}"
    source: pull
  loop: "{{ vllm_models }}"
  loop_control:
    label: "{{ item.image | default(vllm_docker_image) }}"
  become: true
  when: vllm_models | length > 0

- name: Create model cache directories
  ansible.builtin.file:
    path: "{{ item.cache_path }}"
    state: directory
    mode: "0775"
    owner: root
    group: root
  loop: "{{ vllm_models }}"
  loop_control:
    label: "{{ item.name }}: {{ item.cache_path }}"
  become: true

- name: Check if model is already downloaded
  ansible.builtin.stat:
    path: "{{ item.cache_path }}/hub/models--{{ item.model_id | replace('/', '--') }}"
  loop: "{{ vllm_models }}"
  loop_control:
    label: "{{ item.name }}"
  register: model_dirs
  become: true

- name: Download models via HuggingFace Hub
  ansible.builtin.command: >
    docker run --rm --entrypoint python3
    -v {{ item.item.cache_path }}:/root/.cache/huggingface
    {{ item.item.image | default(vllm_docker_image) }}
    -c "from huggingface_hub import snapshot_download; snapshot_download('{{ item.item.model_id }}')"
  loop: "{{ model_dirs.results }}"
  loop_control:
    label: "{{ item.item.name }}: {{ item.item.model_id }}"
  when: not item.stat.exists
  become: true
  timeout: 1800

- name: Display downloaded models
  ansible.builtin.command: "du -sh {{ item.cache_path }}/hub/models--{{ item.model_id | replace('/', '--') }}"
  loop: "{{ vllm_models }}"
  loop_control:
    label: "{{ item.name }}"
  register: model_sizes
  changed_when: false
  become: true

- name: Show model sizes
  ansible.builtin.debug:
    msg: "{{ item.stdout }}"
  loop: "{{ model_sizes.results }}"
  loop_control:
    label: "{{ item.item.name }}"
