---
wireguard_port: 51820
wireguard_interface: wg0
wireguard_config_dir: /etc/wireguard
wireguard_hub: ""
wireguard_hub_routes: []
wireguard_peer_endpoints: {}
wireguard_persistent_keepalive: 25
# MTU par defaut du tunnel : valeur conservatrice tenant sur le peer le plus contraint du mesh.
# Overrider en host_vars pour les noeuds dont TOUS les chemins peer supportent plus (ex. 100% vRack -> 1420).
wireguard_mtu: 1390
