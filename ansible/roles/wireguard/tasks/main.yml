---
- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
  become: true

- name: Ensure WireGuard config directory exists
  ansible.builtin.file:
    path: "{{ wireguard_config_dir }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true

- name: Check if private key exists
  ansible.builtin.stat:
    path: "{{ wireguard_config_dir }}/private.key"
  register: wg_private_key_file
  become: true

- name: Generate WireGuard private key
  ansible.builtin.shell: wg genkey | tee {{ wireguard_config_dir }}/private.key
  args:
    creates: "{{ wireguard_config_dir }}/private.key"
  register: wg_genkey
  become: true
  when: not wg_private_key_file.stat.exists

- name: Set private key file permissions
  ansible.builtin.file:
    path: "{{ wireguard_config_dir }}/private.key"
    mode: "0600"
    owner: root
    group: root
  become: true

- name: Read private key
  ansible.builtin.slurp:
    src: "{{ wireguard_config_dir }}/private.key"
  register: wg_private_key_slurp
  become: true

- name: Set private key fact
  ansible.builtin.set_fact:
    wireguard_private_key: "{{ wg_private_key_slurp.content | b64decode | trim }}"

- name: Derive public key
  ansible.builtin.shell: echo "{{ wireguard_private_key }}" | wg pubkey
  register: wg_pubkey_result
  changed_when: false
  become: true

- name: Set public key fact
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ wg_pubkey_result.stdout | trim }}"

- name: Save public key to file
  ansible.builtin.copy:
    content: "{{ wireguard_public_key }}"
    dest: "{{ wireguard_config_dir }}/public.key"
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Template WireGuard configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_dir }}/{{ wireguard_interface }}.conf"
    mode: "0600"
    owner: root
    group: root
  become: true
  notify: restart wireguard

- name: Enable IP forwarding (hub node)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  become: true
  when: inventory_hostname == wireguard_hub

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
  become: true

- name: Verify WireGuard interface
  ansible.builtin.command: wg show {{ wireguard_interface }}
  register: wg_show
  changed_when: false
  become: true

- name: Display WireGuard status
  ansible.builtin.debug:
    msg: "{{ wg_show.stdout_lines }}"
