---
# Base role - Ubuntu 24.04 server preparation for K3S

- name: Set hostname to match inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags:
    - base
    - hostname

- name: Configure /etc/hosts with cluster nodes
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
    backup: yes
  tags:
    - base
    - hosts

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  tags:
    - base
    - timezone

- name: Set locale
  community.general.locale_gen:
    name: "{{ base_locale }}"
    state: present
  tags:
    - base
    - locale

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - base
    - packages

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: safe
  tags:
    - base
    - packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
  tags:
    - base
    - packages

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: false
  tags:
    - base
    - swap

- name: Remove swap from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'
  tags:
    - base
    - swap

- name: Disable swap service if exists
  ansible.builtin.systemd:
    name: "{{ base_swap_service }}"
    state: stopped
    enabled: no
  loop:
    - swap.target
    - swapfile.swap
  loop_control:
    loop_var: base_swap_service
  failed_when: false  # Services may not exist on all systems (swap.target, swapfile.swap)
  tags:
    - base
    - swap

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ base_kernel_module }}"
    state: present
  loop: "{{ base_kernel_modules }}"
  loop_control:
    loop_var: base_kernel_module
  tags:
    - base
    - kernel

- name: Persist kernel modules
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/k8s.conf
    line: "{{ base_kernel_module }}"
    create: yes
    owner: root
    group: root
    mode: '0644'
  loop: "{{ base_kernel_modules }}"
  loop_control:
    loop_var: base_kernel_module
  tags:
    - base
    - kernel

- name: Configure sysctl parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ base_sysctl_param.key }}"
    value: "{{ base_sysctl_param.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: yes
  loop: "{{ base_sysctl_params | dict2items }}"
  loop_control:
    loop_var: base_sysctl_param
  tags:
    - base
    - sysctl

- name: Install UFW firewall
  ansible.builtin.apt:
    name: ufw
    state: present
  when: base_ufw_enabled
  tags:
    - base
    - firewall

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ base_ufw_default_incoming }}"
  when: base_ufw_enabled
  tags:
    - base
    - firewall

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ base_ufw_default_outgoing }}"
  when: base_ufw_enabled
  tags:
    - base
    - firewall

- name: Configure UFW rules
  community.general.ufw:
    rule: allow
    port: "{{ base_ufw_rule.port }}"
    proto: "{{ base_ufw_rule.proto }}"
    comment: "{{ base_ufw_rule.comment }}"
  loop: "{{ base_ufw_rules }}"
  loop_control:
    loop_var: base_ufw_rule
  when: base_ufw_enabled
  tags:
    - base
    - firewall

- name: Check cluster_network before touching inter-node rules
  ansible.builtin.assert:
    that:
      - base_ufw_cluster_network | length > 0 or groups['all'] | length == 1
      - base_ufw_cluster_network not in ['0.0.0.0/0', '::/0']
    fail_msg: >-
      cluster_network must be the private CIDR shared by the nodes
      (got '{{ base_ufw_cluster_network }}'). It is required on a multi-node
      cluster and can never be 0.0.0.0/0.
  when: base_ufw_enabled
  tags:
    - base
    - firewall

# A wrong cluster_network would cut this node off from the others as soon as
# the legacy world-open rules are removed below.
- name: Check that this node has an address in cluster_network
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress, sys
        net = ipaddress.ip_network(sys.argv[1], strict=False)
        addrs = [a for a in sys.argv[2].split(",") if a]
        if not any(ipaddress.ip_address(a) in net for a in addrs):
            sys.exit("no address of this node (%s) is in cluster_network %s" % (", ".join(addrs), net))
      - "{{ base_ufw_cluster_network }}"
      - "{{ ansible_facts['all_ipv4_addresses'] | join(',') }}"
  changed_when: false
  check_mode: false
  when:
    - base_ufw_enabled
    - base_ufw_cluster_network | length > 0
  tags:
    - base
    - firewall

- name: Allow cluster network traffic
  community.general.ufw:
    rule: allow
    from_ip: "{{ base_ufw_cluster_network }}"
    comment: "Cluster internal network"
  when:
    - base_ufw_enabled
    - base_ufw_cluster_network | length > 0
  tags:
    - base
    - firewall

- name: Allow traffic from the pods of this node
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ base_ufw_pod_interface }}"
    from_ip: "{{ base_ufw_pod_network }}"
    comment: "K3S pods of this node"
  when: base_ufw_enabled
  tags:
    - base
    - firewall

- name: Remove legacy world-open K3S and NFS rules
  community.general.ufw:
    rule: allow
    port: "{{ base_ufw_legacy_rule.port }}"
    proto: "{{ base_ufw_legacy_rule.proto }}"
    delete: true
  loop: "{{ base_ufw_legacy_rules }}"
  loop_control:
    loop_var: base_ufw_legacy_rule
  when: base_ufw_enabled
  tags:
    - base
    - firewall

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: base_ufw_enabled
  tags:
    - base
    - firewall

# Longhorn support (optional - disabled by default when using NFS)
- name: Install open-iscsi for Longhorn
  ansible.builtin.apt:
    name: open-iscsi
    state: present
  when: base_longhorn_support
  tags:
    - base
    - storage
    - longhorn

- name: Ensure iscsid service is started (for Longhorn)
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: yes
  when: base_longhorn_support
  tags:
    - base
    - storage
    - longhorn

# ============================================================================
# DISABLE AUTOMATIC APT UPGRADES (cluster-wide)
# ----------------------------------------------------------------------------
# Auto-upgrades restart service-linked daemons via needrestart. On 2026-06-10
# an openssl/libssl3t64 auto-upgrade bounced systemd-networkd on a GPU node,
# dropping its DHCP route to the master and isolating it for ~9h. Cluster nodes
# are patched in controlled maintenance windows instead.
#
# This block has its own `auto-upgrades` tag so it can be applied standalone
# (ansible-playbook playbooks/site.yml --tags auto-upgrades) WITHOUT running the
# role's "Upgrade all packages" task, which would itself risk the same outage.
# ============================================================================
- name: Disable automatic apt upgrades (Periodic config)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      // Managed by Ansible - automatic upgrades disabled cluster-wide.
      // See base role defaults (base_disable_auto_upgrades) for rationale.
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
  when: base_disable_auto_upgrades
  tags:
    - base
    - auto-upgrades

- name: Mask apt auto-upgrade timers (authoritative)
  ansible.builtin.systemd:
    name: "{{ auto_upgrade_timer }}"
    state: stopped
    enabled: no
    masked: yes
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  loop_control:
    loop_var: auto_upgrade_timer
  when: base_disable_auto_upgrades
  tags:
    - base
    - auto-upgrades
