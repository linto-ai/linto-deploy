---
# Handlers for the gpu role

- name: restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    daemon_reload: yes
  failed_when: false

- name: restart k3s server
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: "'masters' in group_names"

- name: restart k3s agent
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when: "'masters' not in group_names"

# NOTE: restarting MPS tears down the shared server, so any vLLM process currently
# attached loses the GPU until it reconnects. Only fires when the unit file changes,
# and the gpu role is already reboot-heavy, so this is not a hot-path handler.
- name: restart nvidia-mps
  ansible.builtin.systemd:
    name: nvidia-mps
    state: restarted
    daemon_reload: yes
