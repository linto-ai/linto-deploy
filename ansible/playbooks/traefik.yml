---
# Traefik playbook - Traefik ingress controller installation
#
# Usage:
#   ansible-playbook playbooks/traefik.yml
#
# This playbook:
# 1. Adds the Traefik Helm repository
# 2. Installs Traefik with hostPort configuration
# 3. Configures cert-manager integration if enabled
#
# Prerequisites:
# - K3S must be installed and running
# - Helm must be installed
# - Ingress nodes must have the label node-role.kubernetes.io/ingress

- name: Install Traefik Ingress Controller
  hosts: masters[0]
  become: true
  tags:
    - traefik
    - ingress
    - kubernetes
  vars:
    traefik_namespace: traefik
    # Pinned to chart 34.0.0 (Traefik v3.3.1). DO NOT bump to v3.6.x (chart 38.x):
    # Traefik v3.6 has a UDP regression (GitHub #12251/#12252, area/udp) that corrupts
    # UDP packets ("message too long") and breaks SRT streaming on the srt entrypoint.
    # Confirmed 2026-06-08: v3.6.6 scattered/dropped SRT ~every 10 min; v3.3.1 = 0 errors.
    # Before any future bump, test sustained SRT (LinTO Live) on the new version first.
    traefik_chart_version: "34.0.0"
    traefik_enable_certmanager: true
  tasks:
    - name: Check if K3S is running
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: k3s_config

    - name: Fail if K3S is not running
      ansible.builtin.fail:
        msg: "K3S is not installed on this node. Run the k3s-cluster.yml playbook first."
      when: not k3s_config.stat.exists

    - name: Add Traefik Helm repository
      ansible.builtin.command: helm repo add traefik https://traefik.github.io/charts
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when: false

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Create Traefik namespace
      ansible.builtin.command: kubectl create namespace {{ traefik_namespace }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ns_create
      changed_when: ns_create.rc == 0
      failed_when: ns_create.rc != 0 and 'already exists' not in ns_create.stderr

    - name: Create Traefik values file
      ansible.builtin.copy:
        dest: /tmp/traefik-values.yaml
        content: |
          # Traefik configuration for LinTO
          # Managed by Ansible

          # Use hostPort instead of LoadBalancer (no cloud LB)
          service:
            type: ClusterIP

          # Bind to host ports
          ports:
            web:
              hostPort: 80
            websecure:
              hostPort: 443
            # SRT streaming (UDP) - used by LinTO Live session transcriber
            srt:
              port: 8889
              hostPort: 8889
              protocol: UDP
              expose:
                default: true
            # RTMP streaming (TCP) - used by LinTO Live session transcriber
            rtmp:
              port: 1935
              hostPort: 1935
              protocol: TCP
              expose:
                default: true

          # UDP timeout for SRT streams + extended read timeout for large media uploads
          # (3h MP3 @128kbps ~= 180MB, and multi-GB registry image pushes ; default
          # Traefik readTimeout of 60s is too short, and 30min is still tight for big
          # uploads on slow uplinks, so allow up to 1h to read the full request body).
          # Only readTimeout is extended: writeTimeout/idleTimeout left at defaults so
          # long-lived WebSocket connections (cm-api/socket.io, llm-ws, transcriber-ws) are unaffected.
          additionalArguments:
            - "--entryPoints.srt.udp.timeout=60s"
            - "--entryPoints.web.transport.respondingTimeouts.readTimeout=3600s"
            - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=3600s"

          # Run as DaemonSet on ingress nodes only
          deployment:
            kind: DaemonSet

          # Node selector - run only on ingress nodes
          nodeSelector:
            node-role.kubernetes.io/ingress: "true"

          # Tolerate ingress node taints if any
          tolerations:
            - key: "node-role.kubernetes.io/ingress"
              operator: "Exists"
              effect: "NoSchedule"

          # Enable CRD provider for IngressRoute/Middleware
          providers:
            kubernetesCRD:
              enabled: true
              allowCrossNamespace: true
            kubernetesIngress:
              enabled: true

          # Enable Traefik dashboard (disabled by default for security)
          ingressRoute:
            dashboard:
              enabled: false

          # Logging
          logs:
            general:
              level: INFO
            access:
              enabled: true

          # Install CRDs
          ingressClass:
            enabled: true
            isDefaultClass: true
        mode: '0644'

    - name: Install/Upgrade Traefik
      ansible.builtin.command: >
        helm upgrade --install traefik traefik/traefik
        --namespace {{ traefik_namespace }}
        --values /tmp/traefik-values.yaml
        --version {{ traefik_chart_version }}
        --wait
        --timeout 5m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: traefik_install
      changed_when: "'has been upgraded' in traefik_install.stdout or 'has been installed' in traefik_install.stdout"

    - name: Wait for Traefik pods to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=ready pod
        -l app.kubernetes.io/name=traefik
        -n {{ traefik_namespace }}
        --timeout=120s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Verify Traefik CRDs are installed
      ansible.builtin.command: kubectl get crd middlewares.traefik.io
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: crd_check
      changed_when: false

    - name: Display Traefik status
      ansible.builtin.debug:
        msg: |
          === Traefik Ingress Controller ===
          Namespace: {{ traefik_namespace }}
          Chart Version: {{ traefik_chart_version }}

          Traefik is now installed and listening on ports 80/443/1935/8889
          on nodes with the label node-role.kubernetes.io/ingress

          To verify:
            kubectl get pods -n {{ traefik_namespace }}
            kubectl get svc -n {{ traefik_namespace }}
            kubectl get ingressroute -A

    - name: Clean up values file
      ansible.builtin.file:
        path: /tmp/traefik-values.yaml
        state: absent
