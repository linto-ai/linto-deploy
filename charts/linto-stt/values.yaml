# Default values for linto-stt
# This is a YAML-formatted file.

global:
  domain: localhost
  imageTag: latest-unstable
  tls:
    enabled: true
    mode: mkcert
    acmeEmail: ""
    secretName: linto-tls  # Shared TLS secret across all charts
    createCertificate: false  # linto-studio creates the certificate
  storage:
    database:
      hostPath: ""  # Local storage for MongoDB, Redis
      nodeSelector: {}  # e.g., kubernetes.io/hostname: linto-gpu-01
    files:
      hostPath: ""  # NFS storage for models
  storageClass: ""

# API Gateway for STT services
apiGateway:
  enabled: true
  replicas: 1
  image:
    repository: lintoai/linto-api-gateway
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    COMPONENTS: ApiWatcher,WebServer  # No ServiceWatcher on Kubernetes (no docker.sock)
  service:
    port: 80
  ingress:
    path: /gateway
    stripPrefix: false  # API Gateway routes already include /gateway prefix

# Whisper API service
whisper:
  enabled: true
  replicas: 1
  image:
    repository: lintoai/linto-transcription-service
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    SERVICE_NAME: whisper-large-v3-turbo
    GATEWAY_DESCRIPTION: '{"en": "Recommended (Whisper Large V3)", "fr": "Recommandé (Whisper Large V3)"}'
    LANGUAGE: "*,fr,en,de,es,it,pt,nl,ru,zh,ja,ko,ar"
    CONCURRENCY: "2"
    BROKER_PASS: ""
    SECURITY_LEVEL: "0"
    SPEAKER_ID_API_TOKEN: ""  # Optional shared token for /speaker-identification routes (must match studio-api)
  service:
    port: 80
  ingress:
    path: /whisper-large-v3-turbo
    stripPrefix: true

# Whisper workers
# replicasPerGpu: list where index = GPU index, value = replicas on that GPU
# Example: [1, 1] = 1 worker on GPU 0, 1 worker on GPU 1
# Example: [2, 2, 1, 1] = 2 workers on GPU 0 & 1, 1 worker on GPU 2 & 3
whisperWorkers:
  enabled: true
  replicasPerGpu: [1]  # Default: 1 worker on GPU 0 (single GPU setup)
  image:
    repository: lintoai/linto-stt-whisper
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    SERVICE_NAME: whisper-large-v3-turbo
    MODEL: large-v3-turbo
    LANGUAGE: "*"
    DEVICE: cuda
    CONCURRENCY: "1"
    BROKER_PASS: ""
    SECURITY_LEVEL: "0"
    # Disable the per-chunk VAD inside the worker. The audio is already chunked
    # upstream by the transcription-service VAD; this second VAD (auditok by
    # default) was stripping low-energy speech, causing 15-25% missing words
    # on multi-speaker meetings. Letting Whisper see the full chunk avoids it.
    VAD: "false"
    # Override the empty PROMPT default in linto-stt-whisper's .envdefault.
    # When PROMPT="" is loaded, decoding.py passes initial_prompt="" to
    # faster-whisper which collapses all word timestamps to the end of the
    # chunk, dropping ~30s of speech per affected chunk. Setting any short
    # non-trivial prompt avoids the bug. We additionally seed it with the
    # brand vocabulary we want Whisper to recognize (LINAGORA, LinTO, …).
    PROMPT: "Réunion chez LINAGORA. Produits : LinTO, OpenRag, Twake."

# NeMo transcription service (HTTP API, like whisper but for NeMo workers)
nemo:
  enabled: false
  replicas: 1
  image:
    repository: lintoai/linto-transcription-service
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    SERVICE_NAME: nemo-parakeet-tdt-v3
    GATEWAY_DESCRIPTION: '{"en": "Fast (Parakeet)", "fr": "Rapide (Parakeet)"}'
    LANGUAGE: "*,fr,en,de,es,it,pt,nl,pl,ro,cs,hu,el,fi,sv,uk,da,bg,hr,sk,sl,lt,lv,et,hi"
    CONCURRENCY: "2"
    BROKER_PASS: ""
    SECURITY_LEVEL: "0"
  service:
    port: 80
  ingress:
    path: /nemo-parakeet-tdt-v3
    stripPrefix: true

# NeMo workers (GPU task workers)
# replicasPerGpu: same pattern as whisperWorkers
nemoWorkers:
  enabled: false
  replicasPerGpu: [1]
  image:
    repository: lintoai/linto-stt-nemo
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    SERVICE_NAME: nemo-parakeet-tdt-v3
    MODEL: nvidia/parakeet-tdt-0.6b-v3
    ARCHITECTURE: rnnt_bpe
    LANGUAGE: "*"
    DEVICE: cuda
    CONCURRENCY: "1"
    BROKER_PASS: ""
    SECURITY_LEVEL: "0"

# Diarization service
# replicasPerGpu: same pattern as whisperWorkers
diarization:
  enabled: true
  replicasPerGpu: [1]  # Default: 1 diarization on GPU 0 (single GPU setup)
  image:
    repository: lintoai/linto-diarization-pyannote
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    SERVICE_NAME: stt-diarization-pyannote
    QUEUE_NAME: diarization-pyannote
    DEVICE: cuda
    CONCURRENCY: "1"
    BROKER_PASS: ""
    MODEL_INFO: '{"en": "Yes", "fr": "Oui"}'

# Qdrant vector DB - speaker identification voiceprint collections
# Used by the diarization workers; one collection per Studio voiceprint collection.
# Disabled by default: existing deployments are NOT touched until this is
# explicitly enabled (the diarization QDRANT_* env vars are gated on it too).
qdrant:
  enabled: false
  image:
    repository: qdrant/qdrant
    # Keep in sync with the qdrant-client version baked into the linto-diarization
    # image: the client refuses a server more than 1 minor away (UserWarning, then
    # degraded). v1.12.4 vs client 1.16.x triggers it; v1.16.x is safe.
    tag: v1.16.2
    pullPolicy: IfNotPresent
  apiKey: ""  # Optional; injected as QDRANT_API_KEY in diarization workers
  resources:
    limits: {}  # No limits for databases - they manage their own memory
    requests:
      cpu: 10m
      memory: 128Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    port: 6333

# Redis task broker (redis-stack-server required for JSON module used by diarization)
redis:
  enabled: true
  image:
    repository: redis/redis-stack-server
    tag: latest
    pullPolicy: IfNotPresent
  password: ""
  resources:
    limits: {}  # No limits for databases - they manage their own memory
    requests:
      cpu: 10m
      memory: 64Mi
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  service:
    port: 6379

# MongoDB for job metadata
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "6.0.2"
    pullPolicy: IfNotPresent
  resources:
    limits: {}  # No limits for databases - they manage their own memory
    requests:
      cpu: 10m
      memory: 64Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    port: 27017
