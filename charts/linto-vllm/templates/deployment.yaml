{{- range $name, $instance := .Values.instances }}
{{- if $instance.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linto-vllm.fullname" $ }}-{{ $name }}
  labels:
    {{- include "linto-vllm.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  revisionHistoryLimit: 5
  replicas: {{ $instance.replicas | default 1 }}
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "linto-vllm.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $instance.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $instance.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 0:0 /cache && chmod -R 775 /cache"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: models-cache
              mountPath: /cache
      containers:
        - name: vllm
          image: "{{ $instance.image.repository }}:{{ $instance.image.tag | default (include "linto-vllm.imageTag" $) }}"
          imagePullPolicy: {{ include "linto-vllm.imagePullPolicy" $ | trim }}
          {{- if $instance.extraPipPackages }}
          command: ["sh", "-c"]
          args:
            - {{ printf "pip install %s && exec vllm serve %s --gpu-memory-utilization %s%s --host 0.0.0.0 --port %d" $instance.extraPipPackages $instance.model ($instance.gpuMemoryUtilization | default "0.90") (include "linto-vllm.extraArgsStr" (dict "args" $instance.extraArgs)) (int ($instance.service.port | default 8000)) | quote }}
          {{- else }}
          args:
            - "--model"
            - {{ $instance.model | quote }}
            - "--gpu-memory-utilization"
            - {{ $instance.gpuMemoryUtilization | default "0.90" | quote }}
            {{- range $instance.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: HUGGING_FACE_HUB_TOKEN
              value: ""
            {{- range $key, $value := $instance.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $instance.service.port | default 8000 }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 2
          {{- with $instance.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: models-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models-cache
          {{- if $instance.modelCachePath }}
          hostPath:
            path: {{ $instance.modelCachePath }}
            type: DirectoryOrCreate
          {{- else if $.Values.global.storage.files.hostPath }}
          hostPath:
            path: {{ $.Values.global.storage.files.hostPath }}/models/{{ $name }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
{{- end }}
{{- end }}
