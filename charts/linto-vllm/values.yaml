global:
  imageTag: "nightly"
  imagePullPolicy: ""
  storage:
    files:
      hostPath: ""

# Each key under 'instances' creates a separate Deployment + Service.
# Add/remove instances as needed.
instances:
  voxtral:
    enabled: false
    image:
      repository: vllm/vllm-openai
      tag: ""  # defaults to global.imageTag
    # Per-instance hostPath for model cache (overrides global.storage.files.hostPath)
    # Must contain HuggingFace cache structure (hub/models--org--name/...)
    modelCachePath: ""
    # Extra pip packages installed at startup (Voxtral needs audio libs)
    extraPipPackages: "soundfile soxr librosa"
    model: "mistralai/Voxtral-Mini-4B-Realtime-2602"
    # Voxtral audio encoder uses ~1.5MB/token KV cache (vs 96KB theoretical)
    # RTX A4000 16GB: ~2592 tokens KV capacity → max-model-len ≤ 2500
    # RTX A4500 20GB: ~4000 tokens → max-model-len ≤ 3500
    # A100 40GB+: can go higher, adjust per GPU
    extraArgs:
      - "--max-model-len"
      - "2500"
      - "--max-num-seqs"
      - "2"
      - "--enforce-eager"
    gpuMemoryUtilization: "0.90"
    replicas: 1
    service:
      port: 8000
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: 16Gi
      requests:
        nvidia.com/gpu: "1"
        memory: 4Gi
    nodeSelector: {}
    tolerations: []
    env: {}

  translategemma:
    enabled: false
    image:
      repository: vllm/vllm-openai
      tag: ""
    modelCachePath: ""
    model: "Infomaniak-AI/vllm-translategemma-4b-it"
    extraArgs:
      - "--max-model-len"
      - "2048"
    gpuMemoryUtilization: "0.90"
    replicas: 1
    service:
      port: 8000
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: 16Gi
      requests:
        nvidia.com/gpu: "1"
        memory: 4Gi
    nodeSelector: {}
    tolerations: []
    env: {}
